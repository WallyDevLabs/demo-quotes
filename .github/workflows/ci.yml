name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      # A throwaway value for the test run only; it protects nothing. Real deployments use their own.
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_e2e?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      # Domain tests plus integration tests against the real Postgres above.
      - run: npm test
      - run: npm run build
      # The end-to-end run: a real browser (the Chrome on the runner) through the whole business flow, against
      # the production build made above, on its own freshly migrated database.
      - run: node scripts/prepare-e2e-db.mjs
      - run: E2E_SKIP_BUILD=1 npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: test-results
          retention-days: 7
